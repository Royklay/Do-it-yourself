<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do It Yourself</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>
      <!-- Navigation Bar -->
    <header>
        <nav class="navbar">

            <div class="logo">
                <i class="fa-solid fa-screwdriver-wrench"></i>
                <span>FixItYourself</span>
            </div>

            <ul class="nav-links">
                <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="about.html"><i class="fa-solid fa-circle-info"></i> About</a></li>
                <li><a href="help.html"><i class="fa-solid fa-circle-question"></i> Help</a></li>
            </ul>

            <div class="nav-buttons">
                <a href="login.html" class="signin-btn active">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In
                </a>

                <a href="signup.html" class="getstarted-btn">
                    <i class="fa-solid fa-rocket"></i> Get Started
                </a>
            </div>

        </nav>
    </header>

      <!-- Sign In Section -->
    <main class="login-section">

        <div class="login-container">

            <div class="login-icon">
                <i class="fa-solid fa-user"></i>
            </div>

            <h1>Welcome Back</h1>

            <p>Sign in to continue fixing things yourself.</p>

  <!-- Sign In Form -->
            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email"
                            placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password"
                            placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    Sign In <i class="fa-solid fa-arrow-right"></i>
                </button>

                <p id="message"></p>

            </form>

            <p class="signup-link">
                Don't have an account?
                <a href="signup.html">Get Started</a>
            </p>

        </div>

    </main>
    
</body>
</html>
